<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>System C · 예약/배차 관리 (mock)</title>
<style>
  body { font-family: -apple-system, sans-serif; margin: 0; background: #f4f6f8; color: #1b1f24; }
  header { background: #1f5c3a; color: #fff; padding: 16px 24px; }
  header h1 { margin: 0; font-size: 18px; }
  main { padding: 24px; max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
  .card { background: #fff; border-radius: 8px; padding: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .card h2 { margin: 0 0 12px; font-size: 15px; }
  label { display: block; font-size: 12px; color: #555; margin: 10px 0 4px; }
  input { width: 100%; box-sizing: border-box; padding: 7px; font-size: 13px; border: 1px solid #ccc; border-radius: 4px; }
  button { margin-top: 14px; padding: 9px 16px; font-size: 13px; background: #1f5c3a; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
  .result { margin-top: 12px; padding: 10px; background: #eef7ee; border: 1px solid #bfe3bf; border-radius: 6px; font-size: 13px; }
  table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 12px; }
  th, td { border: 1px solid #ddd; padding: 5px 8px; text-align: left; }
  th { background: #f0f0f0; }
  .demo-banner { background: #f5c518; color: #1b1f24; font-weight: 800; font-size: 12px; text-align: center; padding: 7px 12px; letter-spacing: .2px; }
</style>
</head>
<body>
<div class="demo-banner">⚠ 데모용 예시 화면입니다 — 실제 사내 시스템이 아닙니다</div>
<div id="root"></div>

<script src="/vendor/react.production.min.js"></script>
<script src="/vendor/react-dom.production.min.js"></script>
<script>
  const h = React.createElement

  function Field(props) {
    return h('div', null,
      h('label', { htmlFor: props.id }, props.label),
      h('input', { id: props.id, value: props.value, onChange: (e) => props.onChange(e.target.value) })
    )
  }

  // 블록 생성. RPA 자동화는 네이티브 value setter + dispatchEvent('input')로 채운다.
  function BlockCreation() {
    const [date, setDate] = React.useState('')
    const [timeSlot, setTimeSlot] = React.useState('')
    const [reason, setReason] = React.useState('')
    const [result, setResult] = React.useState(null)

    async function submit() {
      const res = await fetch('/api/blocks', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ date, timeSlot, reason }),
      })
      setResult(await res.json())
    }

    return h('div', { className: 'card' },
      h('h2', null, '1. 블록 생성'),
      h(Field, { id: 'block-date', label: '날짜', value: date, onChange: setDate }),
      h(Field, { id: 'block-timeslot', label: '시간대', value: timeSlot, onChange: setTimeSlot }),
      h(Field, { id: 'block-reason', label: '사유', value: reason, onChange: setReason }),
      h('button', { id: 'submit-block-btn', onClick: submit }, '블록 생성'),
      result && h('div', { className: 'result', id: 'block-result' }, `블록 생성 완료: ${result.blockId}`)
    )
  }

  function ReservationCreation() {
    const [customer, setCustomer] = React.useState('')
    const [phone, setPhone] = React.useState('')
    const [datetime, setDatetime] = React.useState('')
    const [resourceType, setResourceType] = React.useState('')
    const [result, setResult] = React.useState(null)

    async function submit() {
      const res = await fetch('/api/reservations', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ customerName: customer, phone, datetime, resourceType }),
      })
      setResult(await res.json())
    }

    return h('div', { className: 'card' },
      h('h2', null, '2. 고객 예약 생성'),
      h(Field, { id: 'rsv-customer', label: '고객명', value: customer, onChange: setCustomer }),
      h(Field, { id: 'rsv-phone', label: '연락처', value: phone, onChange: setPhone }),
      h(Field, { id: 'rsv-datetime', label: '희망일시', value: datetime, onChange: setDatetime }),
      h(Field, { id: 'rsv-resource-type', label: '자원 종류', value: resourceType, onChange: setResourceType }),
      h('button', { id: 'submit-reservation-btn', onClick: submit }, '예약 생성'),
      result && h('div', { className: 'result', id: 'reservation-result' }, `예약 생성 완료: ${result.reservationId}`)
    )
  }

  function ResourceSearch() {
    const [candidates, setCandidates] = React.useState(null)

    async function search() {
      const res = await fetch('/api/candidates')
      const data = await res.json()
      setCandidates(data.candidates)
    }

    return h('div', { className: 'card' },
      h('h2', null, '3. 후보 검색·스코어링'),
      h('button', { id: 'search-vehicles-btn', onClick: search }, '후보 조회'),
      candidates && h('table', { id: 'vehicle-table' },
        h('thead', null, h('tr', null,
          h('th', null, 'ID'), h('th', null, '식별코드'), h('th', null, '유형'),
          h('th', null, '위도'), h('th', null, '경도'), h('th', null, '상태')
        )),
        h('tbody', { id: 'vehicle-tbody' },
          candidates.map((c) => h('tr', { key: c.id },
            h('td', null, c.id), h('td', null, c.code), h('td', null, c.type),
            h('td', null, c.lat), h('td', null, c.lng), h('td', null, c.status)
          ))
        )
      )
    )
  }

  function App() {
    return h(React.Fragment, null,
      h('header', null, h('h1', null, '예약/배차 관리 (System C)')),
      h('main', null, h(BlockCreation), h(ReservationCreation), h(ResourceSearch))
    )
  }

  ReactDOM.createRoot(document.getElementById('root')).render(h(App))
</script>
</body>
</html>
