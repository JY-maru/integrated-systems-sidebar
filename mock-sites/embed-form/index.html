<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>접수양식 붙여넣기</title>
<style>
  body { font-family: -apple-system, sans-serif; margin: 0; padding: 12px; background: #fffdf5; }
  textarea { width: 100%; box-sizing: border-box; height: 140px; font-size: 13px; padding: 8px; border: 1px solid #d8cfa8; border-radius: 6px; resize: vertical; font-family: inherit; }
  .hint { font-size: 11px; color: #9a8c4e; margin: 6px 0 0; line-height: 1.5; }
</style>
</head>
<body>
<div id="root"></div>

<script src="/vendor/react.production.min.js"></script>
<script src="/vendor/react-dom.production.min.js"></script>
<script>
  const h = React.createElement

  const PLACEHOLDER = `예)
고객명: 홍길동
연락처: 010-1234-5678
식별코드: AB-1234
접수일시: 2026-07-25 14:30
위치: 서울시 강남구
상세내용: 후방 추돌사고`

  function App() {
    const [text, setText] = React.useState('')
    const textRef = React.useRef('')
    textRef.current = text

    React.useEffect(() => {
      // System A 콘텐츠 스크립트(message_router.js)가 REQUEST_DATA(kind:'intake_text')를
      // window.postMessage로 보내면, 현재 textarea 값을 RESPONSE_DATA로 응답한다.
      // REFERENCE.md §4-2 패턴: 요청ID 없이 kind로만 매칭.
      function onMessage(event) {
        const msg = event.data
        if (!msg || msg.type !== 'REQUEST_DATA' || msg.kind !== 'intake_text') return
        event.source.postMessage({ type: 'RESPONSE_DATA', kind: 'intake_text', payload: textRef.current }, '*')
      }
      window.addEventListener('message', onMessage)
      return () => window.removeEventListener('message', onMessage)
    }, [])

    return h(React.Fragment, null,
      h('textarea', {
        id: 'intake-text',
        placeholder: PLACEHOLDER,
        value: text,
        onChange: (e) => setText(e.target.value),
      }),
      h('p', { className: 'hint' },
        '이 폼은 별도 오리진(다른 시스템이 만든 임베드 폼)입니다. 사이드바의 "접수 카드 생성" 버튼을 누르면 확장이 이 iframe에 현재 입력값을 요청합니다.'
      )
    )
  }

  ReactDOM.createRoot(document.getElementById('root')).render(h(App))
</script>
</body>
</html>
